[versions]
# Build plugins
# 4.0.7 (latest 4.0.x patch at port time) — the single-line Boot 4 target (ADR 0026): Framework 7 /
# Security 7 / Jakarta EE 11 / Hibernate 7 / Jackson 3, on the Java 25 toolchain and Gradle 9.x
# wrapper. The resolved-dependency CVE scan is the 7.4 follow-up, run on this post-port tree.
springBoot = "4.0.7"
springDependencyManagement = "1.1.7"
openapiGenerator = "7.14.0"
# Central-Portal-native publishing (ADR 0027). Applied only to the five library modules + the BOM
# via an explicit allow-list in the root build — never the example apps. 0.37.0 is the current
# stable line; publishToMavenCentral() is argument-less (Portal host is the default).
vanniktechMavenPublish = "0.37.0"
# SonarQube scanner for the LOCAL pre-push gate (.sonar-local/ — this public repo has no hosted
# Sonar). 7.x is Gradle-9-ready; the 6.x line calls the removed Convention API and breaks on Gradle 9.
sonarqube = "7.3.1.8318"

# Library deps
# Jackson 3 (tools.jackson) — aligned with Boot 4.0.7's managed version. Annotations stay on the
# com.fasterxml 2.x artifact line (Jackson 3 reads them; databind brings them transitively).
jackson = "3.1.4"
slf4j = "2.0.16"
# Resilience4j — this catalog pin is authoritative (the library modules do not import the Boot BOM
# for it). 2.4.0 removed the internal CircuitBreakerStateMachine(name, config, Clock) constructor
# and 2.3.0+ exposes the Clock publicly via CircuitBreakerConfig.Builder.clock() — the CallGuard's
# virtual-time seam is pure public API from this version on (ADR 0017 addendum, SB4-port T3).
resilience4j = "2.4.0"
# Keycloak admin client (the user-directory port's optional impl, ADR 0020 §8) — released independently
# of the server; the 26.x client line is compatible with the 26.x server the rig runs (26.3.2).
keycloak = "26.0.5"
# commons-io CONSTRAINT (not a direct dependency): keycloak-admin-client 26.x drags commons-io 2.11.0
# transitively via resteasy-multipart-provider → apache-mime4j. 2.0–2.13.x are vulnerable to
# CVE-2024-47554 (XmlStreamReader uncontrolled CPU consumption / DoS, CWE-400, CVSS 4.3), fixed in 2.14.0.
# The Spring Boot 4 BOM does not manage commons-io, so nothing overrides the vulnerable 2.11.0 without
# this pin. The vulnerable XML path is NOT reachable via KeycloakUserDirectory (JSON-only, fail-closed),
# and this module is compileOnly on the published starter (absent from its runtimeClasspath) — so the
# pin is defence-in-depth for adopters who enable the module, not a live-exploit fix. See the 7.4
# security review (docs/code-review/SECURITY-REVIEW-2026-07-12.md, F2).
commonsIo = "2.19.0"

# Example-app deps (managed by the Spring BOM where possible; pinned here when not)
# springdoc 3.x is the Boot-4 line (2.x targets Boot 3).
springdocOpenApi = "3.0.3"
swaggerAnnotations = "2.2.28"
jakartaValidation = "3.1.0"
jakartaAnnotation = "3.0.0"

# Testing
# junit aligned with the Boot BOM's managed version (3.5.16 → Jupiter 5.12.2 / platform 1.12.2);
# an older junit-bom pin here leaves junit-platform-launcher unaligned with the engine and the
# test executor dies at discovery ("OutputDirectoryProvider not available").
junit = "5.12.2"
mockito = "5.14.2"
assertj = "3.27.0"
testcontainers = "1.20.4"

[libraries]
# --- Library modules ---
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
# Resilience4j (Slice B3): the circuit-breaker + core (IntervalFunction) modules back the CallGuard impl.
# Versions are overridden by the Spring Boot BOM where the consuming module imports it.
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-core = { module = "io.github.resilience4j:resilience4j-core", version.ref = "resilience4j" }
keycloak-admin-client = { module = "org.keycloak:keycloak-admin-client", version.ref = "keycloak" }
# Constraint target only (see the commonsIo version comment): forced onto the transitive commons-io.
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }

# --- Example app (codegen support deps the spring generator references) ---
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenApi" }
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations", version.ref = "swaggerAnnotations" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakartaValidation" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakartaAnnotation" }

# --- Testing ---
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
