openapi: 3.0.3
info:
  title: User Management Service API
  description: >
    The ABAC attribute source: teams, role definitions, and grants (team memberships).
    It owns the subject side of the demo and resolves a caller's effective role for a resource,
    feeding the catalog spine's role-definition supplier.

    Ticket 2: User + Team read surface. Owner-on-create, membership/role-def management, transfer,
    and the effective-role resolve API are added in later tickets.
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Meta
    description: Service metadata
  - name: User
    description: User identities (profiles linked to the IdP subject)
  - name: Team
    description: Teams (the durable owner of a resource via its team-target)

paths:
  /api/v1/ping:
    get:
      tags: [Meta]
      summary: Liveness ping
      operationId: ping
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'

  # ------------------------------------------------------------------- Users
  /api/v1/users:
    get:
      tags: [User]
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [User]
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [User]
      summary: Get a user
      operationId: getUser
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- Teams
  /api/v1/teams:
    get:
      tags: [Team]
      summary: List teams
      operationId: listTeams
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
    post:
      tags: [Team]
      summary: Create a team-target (owner-on-create)
      description: >
        Creates a team for the given team-target and, atomically, makes the creator its owner. The
        creator is taken from the authenticated subject when present; `creatorUserId` is accepted as
        an explicit fallback until token-derived identity is wired.
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Team]
      summary: Get a team
      operationId: getTeam
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflict with the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    Pong:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string
          example: UP

    User:
      type: object
      required: [id, subject, displayName]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          description: The IdP subject (Keycloak `sub`) this profile links to.
        displayName:
          type: string

    UserRequest:
      type: object
      required: [subject, displayName]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        displayName:
          type: string
          minLength: 1
          maxLength: 200

    Team:
      type: object
      required: [id, name, targetType, targetId]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        targetType:
          type: string
          description: The team-target's resource type, e.g. "catalog".
        targetId:
          type: string
          format: uuid
          description: The team-target's resource id.

    CreateTeamRequest:
      type: object
      required: [name, targetType, targetId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        targetType:
          type: string
          minLength: 1
          maxLength: 100
        targetId:
          type: string
          format: uuid
        creatorUserId:
          type: string
          format: uuid
          nullable: true
          description: >
            Explicit creator fallback used until token-derived identity is wired (ticket 4). When the
            request is authenticated, the creator is the subject and this field is ignored.

    ApiError:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        timestamp:
          type: string
          format: date-time
