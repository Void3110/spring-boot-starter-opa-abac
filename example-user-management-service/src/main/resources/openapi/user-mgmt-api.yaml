openapi: 3.0.3
info:
  title: User Management Service API
  description: >
    The ABAC attribute source: teams, role definitions, and grants (team memberships).
    It owns the subject side of the demo and resolves a caller's effective role for a resource,
    feeding the catalog spine's role-definition supplier.

    Ticket 2: User + Team read surface. Owner-on-create, membership/role-def management, transfer,
    and the effective-role resolve API are added in later tickets.
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Meta
    description: Service metadata
  - name: User
    description: User identities (profiles linked to the IdP subject)
  - name: Team
    description: Teams (the durable owner of a resource via its team-target)
  - name: Membership
    description: Team membership — the grant binding a user to a role on a team
  - name: RoleDefinition
    description: Role definitions — system roles + team-scoped custom roles
  - name: TagDefinition
    description: The dynamic tag dictionary — global system keys + team-scoped custom keys

paths:
  /api/v1/ping:
    get:
      tags: [Meta]
      summary: Liveness ping
      operationId: ping
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'

  # ------------------------------------------------------------------- Users
  /api/v1/users:
    get:
      tags: [User]
      summary: List users
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [User]
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [User]
      summary: Get a user
      operationId: getUser
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- Teams
  /api/v1/teams:
    get:
      tags: [Team]
      summary: List teams
      operationId: listTeams
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Team]
      summary: Create a team-target (owner-on-create)
      description: >
        Creates a team for the given team-target and, atomically, makes the creator its owner. The
        creator is taken from the authenticated subject when present; `creatorUserId` is accepted as
        an explicit fallback until token-derived identity is wired.
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Team]
      summary: Get a team
      operationId: getTeam
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------- Memberships
  /api/v1/teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Membership]
      summary: List team members
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Membership]
      summary: Add a member (owner/administrator; subject to the subset rule)
      operationId: addMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/teams/{teamId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [Team]
      summary: Transfer ownership (owner only) — new owner promoted, old owner downgraded
      operationId: transferOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '204':
          description: Transferred
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------- Role definitions
  /api/v1/teams/{teamId}/role-definitions:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [RoleDefinition]
      summary: List a team's roles (system + this team's custom roles)
      operationId: listRoleDefinitions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [RoleDefinition]
      summary: Define a team-scoped custom role (owner; subject to the subset rule)
      operationId: createRoleDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleDefinitionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/teams/{teamId}/role-definitions/{code}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: code
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [RoleDefinition]
      summary: Update a team-scoped custom role (owner; subset rule; system roles immutable)
      operationId: updateRoleDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleDefinitionUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [RoleDefinition]
      summary: Delete a team-scoped custom role (owner; system roles immutable)
      operationId: deleteRoleDefinition
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ----------------------------------------------------------- Tag definitions
  /api/v1/tag-definitions:
    get:
      tags: [TagDefinition]
      summary: List tag definitions (global keys, plus a team's keys when teamId is given)
      operationId: listTagDefinitions
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: When present, include this team's keys alongside the global keys.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of tag definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinitionPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/tag-definitions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [TagDefinition]
      summary: Get a tag definition
      operationId: getTagDefinition
      responses:
        '200':
          description: Tag definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinition'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/teams/{teamId}/tag-definitions:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [TagDefinition]
      summary: List a team's tag keys (global keys + this team's custom keys)
      operationId: listTeamTagDefinitions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of tag definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinitionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [TagDefinition]
      summary: Define a team-scoped tag key (owner/administrator)
      operationId: createTeamTagDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDefinitionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/teams/{teamId}/tag-definitions/{key}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: key
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [TagDefinition]
      summary: Update a team-scoped tag key (owner/administrator; global/system keys immutable)
      operationId: updateTeamTagDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDefinitionUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDefinition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [TagDefinition]
      summary: Delete a team-scoped tag key (owner/administrator; global/system keys immutable)
      operationId: deleteTeamTagDefinition
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/teams/{teamId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Membership]
      summary: Change a member's role (owner/administrator; subject to the subset rule)
      operationId: changeMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Membership]
      summary: Remove a member (owner/administrator) — revokes derived access
      operationId: removeMember
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 0-based page index. A bounds violation is a 400 VALIDATION_FAILED (no clamping).
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PerPage:
      name: perPage
      in: query
      description: Page size (1–100). A bounds violation is a 400 VALIDATION_FAILED (no clamping).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict with the current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: The caller is not authorized for this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: The request violates a domain rule (e.g. the subset rule)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    Pong:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string
          example: UP

    PageEnvelope:
      type: object
      description: >
        The shared list envelope. Every public list returns a page of items plus the exact total —
        count is the number of rows the caller may see, across all pages (never items.length).
        page/perPage echo the request. Rows are ordered createdAt ASC, id ASC (a fixed total order;
        clients do not choose the sort). Defined per spec file by convention (no cross-file $ref).
      required: [count, page, perPage]
      properties:
        count:
          type: integer
          format: int64
          description: Total rows the caller is authorized to see, across all pages.
        page:
          type: integer
          minimum: 0
          description: 0-based page index, echoing the request.
        perPage:
          type: integer
          minimum: 1
          maximum: 100
          description: Page size, echoing the request.

    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'

    TeamPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Team'

    MembershipPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Membership'

    RoleDefinitionPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RoleDefinition'

    TagDefinitionPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TagDefinition'

    User:
      type: object
      required: [id, subject, displayName]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          description: The IdP subject (Keycloak `sub`) this profile links to.
        displayName:
          type: string

    UserRequest:
      type: object
      required: [subject, displayName]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        displayName:
          type: string
          minLength: 1
          maxLength: 200

    Team:
      type: object
      required: [id, name, targetType, targetId]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        targetType:
          type: string
          description: The team-target's resource type, e.g. "catalog".
        targetId:
          type: string
          format: uuid
          description: The team-target's resource id.

    CreateTeamRequest:
      type: object
      required: [name, targetType, targetId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        targetType:
          type: string
          minLength: 1
          maxLength: 100
        targetId:
          type: string
          format: uuid
        creatorUserId:
          type: string
          format: uuid
          nullable: true
          description: >
            Explicit creator fallback used until token-derived identity is wired (ticket 4). When the
            request is authenticated, the creator is the subject and this field is ignored.

    Membership:
      type: object
      required: [id, teamId, userId, roleCode]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        teamId:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
        roleCode:
          type: string
          description: The code of the bound role definition (e.g. "owner", "member", or a custom role).

    AddMemberRequest:
      type: object
      required: [userId, roleCode]
      properties:
        userId:
          type: string
          format: uuid
        roleCode:
          type: string
          minLength: 1
          maxLength: 100
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: >
            Explicit actor fallback used until token-derived identity is wired (ticket 4). When the
            request is authenticated, the actor is the subject and this field is ignored.

    ChangeRoleRequest:
      type: object
      required: [roleCode]
      properties:
        roleCode:
          type: string
          minLength: 1
          maxLength: 100
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: Explicit actor fallback (see AddMemberRequest).

    TransferOwnershipRequest:
      type: object
      required: [newOwnerUserId]
      properties:
        newOwnerUserId:
          type: string
          format: uuid
          description: The team member to promote to owner.

    RoleDefinition:
      type: object
      required: [code, system, permissions]
      properties:
        code:
          type: string
        system:
          type: boolean
          description: True for the immutable global ladder; false for team-scoped custom roles.
        teamId:
          type: string
          format: uuid
          nullable: true
          description: Null for system roles; set for team-scoped custom roles.
        roleLevel:
          type: integer
          nullable: true
          description: >-
            The role's tier on the five-tier ladder (10 reader / 20 member / 25 senior /
            30 administrator / 40 owner), read from attributes.role_level.
        attributes:
          type: object
          additionalProperties: true
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: resourceType -> [granted permission categories (READ/WRITE/TAG/GRANT)].
        deniedActions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            Deny-overrides — resourceType -> [denied fine actions], subtracted after category
            expansion. Empty = nothing withheld.
        requiredTags:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Optional tag requirement — tagKey -> [acceptable values]. Empty = no requirement.
        matchMode:
          type: string
          enum: [ANY_OF, ALL_OF]
          nullable: true
          description: How required keys combine; null when there is no tag requirement.

    RoleDefinitionRequest:
      type: object
      required: [code, permissions]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        roleLevel:
          type: integer
          description: >-
            REQUIRED (enforced as 422 ROLE_DEFINITION_INVALID, like every authoring-contract
            violation — deliberately not a schema constraint so the whole contract answers
            uniformly). The role's tier on the authorable ladder: 10 reader / 20 member /
            25 senior / 30 administrator (owner 40 is never authorable). Bounds the grantable
            categories (GRANT only at 30) and is the single source of attributes.role_level —
            an attributes-supplied role_level is overwritten.
        attributes:
          type: object
          additionalProperties: true
          description: Extensible role attributes. role_level is always overwritten from roleLevel.
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            resourceType -> [granted permission categories]. Only the four category tokens
            (READ/WRITE/TAG/GRANT) within the roleLevel's ceiling are accepted (422
            ROLE_DEFINITION_INVALID otherwise).
        deniedActions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >-
            Deny-overrides — resourceType -> [denied fine actions], subtracted after category
            expansion. Each denied action must be granted by that type's categories (strict
            subtraction; 422 otherwise).
        requiredTags:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Optional tag requirement — tagKey -> [acceptable values].
        matchMode:
          type: string
          enum: [ANY_OF, ALL_OF]
          nullable: true

    RoleDefinitionUpdate:
      type: object
      required: [permissions]
      properties:
        roleLevel:
          type: integer
          description: >-
            REQUIRED (enforced as 422 ROLE_DEFINITION_INVALID — see RoleDefinitionRequest).
            The role's tier on the authorable ladder. Same contract as on create — the single
            source of attributes.role_level.
        attributes:
          type: object
          additionalProperties: true
          description: Extensible role attributes. role_level is always overwritten from roleLevel.
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: resourceType -> [granted permission categories] (the four tokens, ceiling-bounded).
        deniedActions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Deny-overrides — must strictly subtract from the granted expansion.
        requiredTags:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        matchMode:
          type: string
          enum: [ANY_OF, ALL_OF]
          nullable: true

    TagDefinition:
      type: object
      required: [id, key, scope, valueType, cardinality, system]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          description: The tag key, e.g. "sensitivity" or "region".
        scope:
          type: string
          enum: [GLOBAL, TEAM]
          description: GLOBAL for seeded system keys; TEAM for team-defined keys.
        teamId:
          type: string
          format: uuid
          nullable: true
          description: Null for GLOBAL keys; the owning team for TEAM keys.
        valueType:
          type: string
          enum: [STRING, ENUM]
        cardinality:
          type: string
          enum: [SINGLE, MULTI]
        allowedValues:
          type: array
          items:
            type: string
          description: The closed set for an ENUM key; empty for a STRING key.
        valuePattern:
          type: string
          nullable: true
          description: An optional regex constraining a STRING value.
        system:
          type: boolean
          description: True for the immutable global/system keys.

    TagDefinitionRequest:
      type: object
      required: [key, valueType, cardinality]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
          description: The tag key (kebab-case recommended), e.g. "tier".
        valueType:
          type: string
          enum: [STRING, ENUM]
        cardinality:
          type: string
          enum: [SINGLE, MULTI]
        allowedValues:
          type: array
          items:
            type: string
          description: Required (non-empty) for ENUM; omitted/empty for STRING.
        valuePattern:
          type: string
          nullable: true
          description: An optional regex for a STRING key.

    TagDefinitionUpdate:
      type: object
      required: [valueType, cardinality]
      properties:
        valueType:
          type: string
          enum: [STRING, ENUM]
        cardinality:
          type: string
          enum: [SINGLE, MULTI]
        allowedValues:
          type: array
          items:
            type: string
        valuePattern:
          type: string
          nullable: true

    ProblemDetail:
      type: object
      description: >
        An RFC-7807 problem object (application/problem+json). Five standard members plus two documented
        extensions (errorCode, timestamp). A client branches on the typed errorCode, not the human detail.
      required: [status, errorCode]
      properties:
        type:
          type: string
          description: A stable, relative, opaque identifier for the problem kind (e.g. /problems/role-subset-violation). Not dereferenced.
        title:
          type: string
          description: A short, status-stable summary of the problem kind.
        status:
          type: integer
          format: int32
          description: The HTTP status code.
        detail:
          type: string
          description: A human, instance-specific explanation.
        instance:
          type: string
          description: The request path that produced the error.
        errorCode:
          type: string
          description: The machine-stable code a consumer branches on. The union of codes this service can emit.
          enum:
            - ACCESS_DENIED
            - RESOURCE_NOT_FOUND
            - VALIDATION_FAILED
            - ROLE_SUBSET_VIOLATION
            - TEAM_TARGET_EXISTS
            - MEMBERSHIP_CONFLICT
            - ROLE_CODE_CONFLICT
            - ROLE_IMMUTABLE
            - TAG_KEY_CONFLICT
            - TAG_DEFINITION_IMMUTABLE
            - TAG_DEFINITION_INVALID
            - ROLE_DEFINITION_INVALID
            - STATE_CONFLICT
        timestamp:
          type: string
          format: date-time
          description: When the error was produced (correlation).
