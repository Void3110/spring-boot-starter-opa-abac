spring:
  application:
    name: user-management-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/usermgmt}
    username: ${SPRING_DATASOURCE_USERNAME:usermgmt}
    password: ${SPRING_DATASOURCE_PASSWORD:usermgmt}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

# OPA ABAC: the user-service dogfoods the starter to secure its own management API. The team policy
# document is served at /v1/data/team; per-type resolution maps resource type "team" -> "team".
opa:
  abac:
    enabled: ${OPA_ABAC_ENABLED:false}
    base-url: ${OPA_ABAC_BASE_URL:http://localhost:8181}
    policy-prefix: ${OPA_ABAC_POLICY_PREFIX:}
    subject:
      # Explicit acknowledgment that a signature-validating gateway (APISIX openid-connect) fronts this
      # app in the rig — the starter's JWT extractor does NOT verify signatures itself. Never enable
      # gateway-less.
      trust-forwarded-jwt: ${OPA_ABAC_TRUST_FORWARDED_JWT:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Actuator: this is the demo app, so a broad set of endpoints is exposed over HTTP for local
# debugging. Note this is NOT a production-safe set — env/configprops/beans can leak config, and
# heapdump/threaddump are intentionally omitted here. Narrow this before any real deployment.
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans,mappings,loggers,metrics,liquibase,conditions
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  level:
    dev.dmitriikonovalov: INFO
