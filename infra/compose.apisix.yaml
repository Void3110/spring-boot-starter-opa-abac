# APISIX gateway + etcd for the local example rig (Phase A: load balancing, no auth).
#
# Brought up by ../deploy.sh as part of the `up` flow. APISIX proxies :9080 -> a
# round-robin upstream over the catalog app pods (reached via host.docker.internal,
# since the pods publish host ports). The Admin API on :9180 is used by
# deploy.sh / init-routes.sh to (re)write the upstream + route.
#
# Joins the same compose project (opa-abac-example) so it shares the network with Postgres.

name: opa-abac-example

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: opa-abac-etcd
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    environment:
      ETCD_ENABLE_V2: "true"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  apisix:
    image: apache/apisix:3.11.0-debian
    container_name: opa-abac-apisix
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      # Host 9085 (not 9080) avoids a clash with podman-machine's gvproxy, which holds :9080.
      - "9085:9080"   # proxy (send app traffic here)
      - "9180:9180"   # admin API (deploy.sh writes upstream/route here)
    # host.docker.internal lets APISIX reach the app pods' published host ports on macOS/Windows.
    # On Linux, deploy.sh adds the host-gateway mapping; here we declare it for portability.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9080 -o /dev/null || curl -sf http://localhost:9180/apisix/admin/routes -H 'X-API-KEY: edd1c9f034335f136f87ad84b625c8f1' -o /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
