# Jaeger v2 with embedded Badger persistent storage.
#
# Badger is a Go-based embedded KV store — no extra container, and traces survive Jaeger
# restarts via a named volume on /badger. (We use Badger rather than Elasticsearch/OpenSearch
# because their JREs SIGILL on aarch64 container VMs — Apple Silicon. Badger has no JVM.)
#
# OTLP in on 4317 (gRPC) / 4318 (HTTP); UI on 16686. Mounted by infra/compose.jaeger.yaml.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: INFO

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: badger_main

  jaeger_storage:
    backends:
      badger_main:
        badger:
          ephemeral: false
          directories:
            keys: /badger/keys
            values: /badger/values
          ttl:
            # 24h retention (was 168h/7d). At always_on sampling a multi-week run accreted a ~13 GB
            # Badger store whose block cache thrashed (hit-ratio 0.03) under load — its collector
            # stalled and APISIX's *synchronous* OTEL exporter blocked in the request worker, adding
            # multi-second tails that invalidated load runs. A day of local debug traces is plenty;
            # the volume is disposable (traces are never source-of-truth). Latency/throughput load
            # runs MUST use ENABLE_TRACING=0 regardless (see scripts/load/run-load.sh header).
            spans: 24h

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_main
