# Static serving for the built demo SPA (see compose.spa.yaml).
#
# Scope honesty: the GATEWAY forwards only `/` + `/index.html` + the favicon paths + `/assets/*`
# here (init-routes.sh `spa-index`/`spa-assets`, priority 40) — client-side deep paths never reach
# this server; they hit the bearer-only catalog catch-all and 401. If a path router ever lands in
# the SPA, widen the gateway routes too — the fallback below alone does not enable deep links.
#
# Both listen directives matter: the stock nginx image's entrypoint only enables IPv6 on its OWN
# default.conf (checksum-gated), never on a mounted one — and busybox wget resolves localhost to
# ::1 first, so an IPv4-only listen makes the healthcheck fail with connection-refused.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundle assets: a missing file is a real error — never mask it as index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # Icons: exact files, fail loudly when absent rather than serving HTML as an image.
    location = /favicon.svg {
        try_files $uri =404;
    }
    location = /favicon.ico {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
