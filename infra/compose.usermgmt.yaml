# The user-management-service (the ABAC attribute source) + its own Postgres, added to the rig when
# ENABLE_USER_SERVICE=1 ./deploy.sh up. Shares the project network (opa-abac-example_default), so the
# catalog pods reach it by DNS as http://usermgmt:8080/internal/effective-role.
#
# Its own DB (usermgmt-postgres) keeps the user-service schema isolated from the catalog's Postgres —
# the two example services own their own data, as a real deployment would. Host port 5434 avoids the
# base Postgres on 5433 and any host Postgres on 5432.

name: opa-abac-example

services:
  usermgmt-postgres:
    image: postgres:16-alpine
    container_name: opa-abac-usermgmt-postgres
    environment:
      POSTGRES_DB: usermgmt
      POSTGRES_USER: usermgmt
      POSTGRES_PASSWORD: usermgmt
    ports:
      - "5434:5432"
    volumes:
      - usermgmtpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usermgmt -d usermgmt"]
      interval: 5s
      timeout: 3s
      retries: 10

  usermgmt:
    image: opa-abac-usermgmt:local
    container_name: usermgmt
    hostname: usermgmt
    depends_on:
      usermgmt-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://opa-abac-usermgmt-postgres:5432/usermgmt"
      SPRING_DATASOURCE_USERNAME: "usermgmt"
      SPRING_DATASOURCE_PASSWORD: "usermgmt"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
      # The user-service dogfoods the starter (its own management API is @OpaPreAuthorize-secured),
      # pointed at the same OPA that serves the team policy document.
      OPA_ABAC_ENABLED: "true"
      OPA_ABAC_BASE_URL: "http://opa:8181"
      OPA_ABAC_POLICY_PREFIX: ""
      # Slice B4 (ADR 0019): enable the cross-service ownership resolver so the PUBLIC createTeam can
      # verify the caller owns the target catalog (the squat-check). Without this the resolver is absent
      # and every public createTeam fails closed to 403. The catalog's in-network /internal/catalog/{id}/
      # created-by read is reached DIRECTLY at a catalog pod (catalog-1:8080) — NOT via the gateway, which
      # never exposes /internal/**. (Demo: the first pod is always present; a real deployment would use a
      # load-balanced internal URL.)
      ABAC_OWNERSHIP_ENABLED: "true"
      ABAC_OWNERSHIP_SERVICES_CATALOG: "http://catalog-1:8080"
      # USER-DIRECTORY-PORT (ADR 0020): the Keycloak-admin identity search, interpolated from
      # deploy.sh's ENABLE_DIRECTORY flag (default false — the NoOp directory stays active and the
      # search sub-path answers 200-empty). server-url is the IN-NETWORK REST base: Keycloak's
      # KC_HOSTNAME_ADMIN_URL (localhost:28888) is a console-URL rewrite, NOT the REST path (§6).
      # catalog-directory is the dedicated view-users-only service account (demo secret, rig-scoped).
      OPA_ABAC_DIRECTORY_KEYCLOAK_ENABLED: "${DIRECTORY_ENABLED:-false}"
      OPA_ABAC_DIRECTORY_KEYCLOAK_SERVER_URL: "http://keycloak:8888"
      OPA_ABAC_DIRECTORY_KEYCLOAK_REALM: "catalog-demo"
      OPA_ABAC_DIRECTORY_KEYCLOAK_CLIENT_ID: "catalog-directory"
      OPA_ABAC_DIRECTORY_KEYCLOAK_CLIENT_SECRET: "catalog-directory-secret"
    ports:
      - "28090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Second user-service instance — HA parity with the two catalog pods. SHARES usermgmt-postgres
  # with usermgmt (same DB, same rows), so the two instances genuinely contend on the same
  # membership/role rows: concurrent mutations serialize through the JPA @Version / mutate()
  # locked-write path, exactly as a real 2-replica deployment would. Distinct hostname/port; every
  # other env is identical to usermgmt-1 (same OPA, same directory config, same ownership seam).
  # deploy.sh republishes the APISIX usermgmt-pool to round-robin over both host ports (28090+28092).
  usermgmt-2:
    image: opa-abac-usermgmt:local
    container_name: usermgmt-2
    hostname: usermgmt-2
    depends_on:
      usermgmt-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://opa-abac-usermgmt-postgres:5432/usermgmt"
      SPRING_DATASOURCE_USERNAME: "usermgmt"
      SPRING_DATASOURCE_PASSWORD: "usermgmt"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
      OPA_ABAC_ENABLED: "true"
      OPA_ABAC_BASE_URL: "http://opa:8181"
      OPA_ABAC_POLICY_PREFIX: ""
      ABAC_OWNERSHIP_ENABLED: "true"
      ABAC_OWNERSHIP_SERVICES_CATALOG: "http://catalog-1:8080"
      OPA_ABAC_DIRECTORY_KEYCLOAK_ENABLED: "${DIRECTORY_ENABLED:-false}"
      OPA_ABAC_DIRECTORY_KEYCLOAK_SERVER_URL: "http://keycloak:8888"
      OPA_ABAC_DIRECTORY_KEYCLOAK_REALM: "catalog-demo"
      OPA_ABAC_DIRECTORY_KEYCLOAK_CLIENT_ID: "catalog-directory"
      OPA_ABAC_DIRECTORY_KEYCLOAK_CLIENT_SECRET: "catalog-directory-secret"
    ports:
      - "28092:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  usermgmtpgdata:
