# The example MCP server (Phase 9, AGENT-TOOL-AUTHZ) — the agent tool surface, added to the rig when
# ENABLE_MCP=1 ./deploy.sh up. Shares the project network (opa-abac-example_default), so it reaches
# the catalog pods and the user-service by DNS.
#
# It owns NO persistence: its @McpTool methods proxy the catalog REST API with the caller's own
# bearer, so there is no Postgres here and nothing to seed. Everything it needs is a policy decision
# and two in-network reads.
#
# THE THREE OUTBOUND BASE-URLS ARE ALL OVERRIDDEN HERE, DELIBERATELY. The shipped application.yml
# defaults are localhost, which inside this container means the container itself. Getting any of them
# wrong fails in a way that looks like a policy bug rather than a config bug:
#   - the CATALOG base-url  -> every tool body fails after the gate has already allowed it;
#   - the ROLE-SOURCE url   -> the principal's type-level ceiling never resolves, so EVERY tool call
#                              denies with `tool-gate-ceiling-unavailable` and the roster degrades to
#                              the unfiltered list. This is the one that reads like "the policy is
#                              broken" when it is really "the URL is wrong";
#   - the OPA url           -> the shipped client fails closed, so every decision is a deny and every
#                              roster is empty.

name: opa-abac-example

services:
  mcp:
    image: opa-abac-mcp:local
    container_name: mcp
    hostname: mcp
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"

      # --- the tool surface's downstream (in-network, NOT a published host port) -----------------
      # Pinned to the first catalog pod, the same way the user-service reaches /internal/** — the
      # gateway never fronts an app-to-app call. (Demo: pod 1 is always present; a real deployment
      # would use a load-balanced internal URL.)
      EXAMPLE_MCP_CATALOG_BASE_URL: "http://catalog-1:8080"

      # --- the principal's type-level ceiling (the tool-gate's other input) ----------------------
      EXAMPLE_MCP_AUTHZ_ROLE_SOURCE_BASE_URL: "http://usermgmt:8080"

      # --- the PDP -------------------------------------------------------------------------------
      OPA_ABAC_ENABLED: "true"
      OPA_ABAC_BASE_URL: "http://opa:8181"
      OPA_ABAC_POLICY_PREFIX: ""
      # A signature-validating gateway (APISIX openid-connect) fronts this service, exactly as it
      # fronts the catalog. Never enable this gateway-less.
      OPA_ABAC_SUBJECT_TRUST_FORWARDED_JWT: "true"

      # --- the demo agent registry ----------------------------------------------------------------
      # One profile per demo actor, matching the three realm clients whose protocol mappers mint the
      # matching act_chain. Every dimension NARROWS: the tool-gate intersects these with the
      # principal's ceiling in Rego, so nothing here can grant an agent what its principal lacks —
      # which is exactly what `agent-overreach` exists to prove on the live rig.
      #
      # agent-readonly  : strictly narrower than its principal (structural reads, capped below
      #                   get_product's medium risk tier) — the persona the roster cut is shown with.
      # agent-overreach : deliberately WIDER than any demo principal (lists WRITE and every verb).
      # agent-revoked   : a known agent with ZERO capability — authoritative-empty, not an outage.
      EXAMPLE_MCP_AGENTS_PROFILES_0_ACTOR_ID: "agent-readonly"
      EXAMPLE_MCP_AGENTS_PROFILES_0_ALLOWED_CATEGORIES: "READ"
      EXAMPLE_MCP_AGENTS_PROFILES_0_ALLOWED_TOOLS: "list_catalogs,get_catalog"
      EXAMPLE_MCP_AGENTS_PROFILES_0_ALLOWED_ACTIONS: "view,list"
      EXAMPLE_MCP_AGENTS_PROFILES_0_MAX_RISK_TAG: "low"

      EXAMPLE_MCP_AGENTS_PROFILES_1_ACTOR_ID: "agent-overreach"
      EXAMPLE_MCP_AGENTS_PROFILES_1_ALLOWED_CATEGORIES: "READ,WRITE,TAG,GRANT"
      EXAMPLE_MCP_AGENTS_PROFILES_1_ALLOWED_TOOLS: "list_catalogs,get_catalog,list_categories,get_product"
      EXAMPLE_MCP_AGENTS_PROFILES_1_ALLOWED_ACTIONS: "view,list,create,update,delete"
      EXAMPLE_MCP_AGENTS_PROFILES_1_MAX_RISK_TAG: "high"

      EXAMPLE_MCP_AGENTS_PROFILES_2_ACTOR_ID: "agent-revoked"
      EXAMPLE_MCP_AGENTS_PROFILES_2_ALLOWED_CATEGORIES: ""
      EXAMPLE_MCP_AGENTS_PROFILES_2_ALLOWED_TOOLS: ""
      EXAMPLE_MCP_AGENTS_PROFILES_2_ALLOWED_ACTIONS: ""
      EXAMPLE_MCP_AGENTS_PROFILES_2_MAX_RISK_TAG: ""

      # --- kill-switches, interpolated by deploy.sh for the E6/E7 drills -------------------------
      # Defaults are ON. E7 replays a denied call with the agent gate OFF to show the catalog's own
      # target-gate still denies it — i.e. OFF is not wider than ON.
      EXAMPLE_MCP_AUTHZ_AGENT_GATE_ENABLED: "${MCP_AGENT_GATE_ENABLED:-true}"
      EXAMPLE_MCP_AUTHZ_ROSTER_FILTER_ENABLED: "${MCP_ROSTER_FILTER_ENABLED:-true}"
    ports:
      # Published for diagnosis only. The e2e enters through the GATEWAY (localhost:9085/mcp), the
      # way every other matrix in this repo does — the service trusts the forwarded JWT precisely
      # because a validating gateway is in front of it.
      - "28093:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
