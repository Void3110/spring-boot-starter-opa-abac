# Keycloak (identity) for the local example rig — completes Phase 2 (gateway OIDC).
#
# Runs in dev mode and imports infra/keycloak/realm-export.json on startup, so the
# realm + client + test user are reproducible from a clean clone (no manual clicking).
# Exports its own spans to Jaeger (Keycloak 26+ has built-in OTEL).
#
# Joins the shared opa-abac-example network; reachable in-network as "keycloak".
#
# IMPORTANT issuer note (measured 2026-08-14, KC 26 — the step-up miner's E9 preflight pins it):
# the `iss` claim FOLLOWS THE REQUEST's Host header. KC_HOSTNAME_STRICT=false is what decides
# this, and KC_HOSTNAME_URL below is not a Keycloak 26 option — it is inert. In-network mints
# therefore carry iss=keycloak:8888 by convention (they address that authority), not by pin; the
# scripted code-flow miner presents the in-network authority from the host for the same parity.
# The openid-connect plugin validates the token SIGNATURE against the realm JWKS and does not
# itself enforce `iss` (also measured — E9's tamper control is what proves the 200 isn't a
# wave-through), so init-routes.sh adds an ISSUER-ALLOWLIST pre-function beside it (hardened
# 2026-08-14): only the THREE rig authorities pass — `keycloak:8888` (in-network mints + the
# miner), `localhost:9085` (THE GATEWAY ORIGIN: the demo SPA's whole PKCE flow runs through the
# gateway's /realms/* passthrough, and Keycloak rewrites its advertised issuer to it — omitting
# this 401s every SPA call, a regression this rig actually shipped for one commit), and
# `localhost:28888` (this published port, reachable directly). `ISSUER_ALLOWLIST` in
# init-routes.sh is the single source; a forged-Host mint is refused (E9's controls pin both the
# deny and the gateway-origin ALLOW). STRICT=false stays: the demo SPA logs in
# through the host port from a browser, which a strict in-network hostname would break. A
# production deployment should still pin the hostname (KC_HOSTNAME + KC_HOSTNAME_STRICT=true).

name: opa-abac-example

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    container_name: opa-abac-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8888"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # STRICT=false makes the issuer follow the request's Host header (see the issuer note above).
      # There is deliberately no hostname pin: the SPA and the in-network callers need DIFFERENT
      # issuers, which is exactly why the gateway carries an allowlist instead. (A `KC_HOSTNAME_URL`
      # line lived here until 2026-08-14 — a removed v1 option that did nothing on KC 26.)
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_ADMIN_URL: "http://localhost:28888"
      # Tracing -> Jaeger (built-in OTEL).
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: "http://opa-abac-jaeger:4318"
      KC_TRACING_PROTOCOL: "http/protobuf"
      KC_TRACING_SAMPLER_RATIO: "1.0"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "28888:8888"   # host access to the Keycloak UI/issuer (admin/admin)
    healthcheck:
      # Keycloak 26 has /health on the management port (9000); the image ships curl-less,
      # so probe via the bundled `kc.sh` readiness is awkward — use a TCP check on 8888.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8888 && echo ok >&3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
