# Local infrastructure for the spring-boot-starter-opa-abac example apps.
#
# Phase 0 (now): just Postgres for catalog-management-service.
# Later phases add: keycloak, apisix, opa, jaeger (see commented stubs below) so the
# full topology — APISIX (OIDC + OPA + tracing) -> catalog-management-service -> Postgres —
# can be brought up incrementally.
#
# Managed via ./profile.sh (up / down / health / logs / status / psql).

name: opa-abac-example

services:
  postgres:
    image: postgres:16-alpine
    container_name: opa-abac-postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    # Host port 5433 to avoid colliding with a podman/other Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

