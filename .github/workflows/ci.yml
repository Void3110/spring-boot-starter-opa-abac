name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # The Rego corpus is the project's authorization proof — a policy regression must not merge green.
  # Runs the same `opa test` the slices run locally, pinned to the rig's OPA version, plus a drift
  # check between the two policy-bundle copies (infra is what the rig's OPA loads; the user-service
  # resources copy is what its tests/docs reference — they must stay byte-identical). Since Phase 6.7
  # (ADR 0015) team.rego is category-driven, so the service bundle also carries verbatim copies of
  # permissions.rego + permission_categories.json (the shared expansion home) — those mirror too.
  opa-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: policy-bundle copies must not drift (infra vs user-service resources)
        run: |
          for f in team.rego team_test.rego permissions.rego permission_categories.json; do
            diff -u "infra/opa/policies/$f" \
              "example-user-management-service/src/main/resources/opa/policies/$f"
          done

      - name: opa test — rig policy corpus (infra/opa/policies)
        run: |
          docker run --rm -v "$PWD/infra/opa/policies:/policies:ro" \
            openpolicyagent/opa:1.10.1 test /policies -v

      - name: opa test — user-service policy copy
        run: |
          docker run --rm -v "$PWD/example-user-management-service/src/main/resources/opa/policies:/policies:ro" \
            openpolicyagent/opa:1.10.1 test /policies -v

  # The clean-room boundary is a RELEASE property of this repo (it is public and clean-room),
  # but until now nothing enforced it on the write path. `scripts/planning/verify-package.sh`
  # scans it — and only when a human happens to verify a planning package, which is neither on
  # push nor on PR. Meanwhile `ml record` writes committed `.mulch/` records mid-session and
  # review notes are written by hand: both leaked a machine-local path at least once, and one
  # leak survived two weeks and a review that declared the class fixed. This job is the trigger
  # that actually fires after those writes.
  clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Home paths are matched CASE-SENSITIVELY on purpose: `-i` would also match REST paths
      # like `/api/v1/users/search`, which these trees quote constantly. A real home path has
      # capitals (`/Users/`, `~/Workspace`); a REST path does not.
      - name: No machine-local paths or tokens in committed trees
        run: |
          if grep -rnE '/Users/[a-z]|~/Workspace' .mulch docs 2>/dev/null; then
            echo "::error::machine-local path committed to a public repo (see hits above)"
            exit 1
          fi
          if grep -rnEi 'glpat-[A-Za-z0-9_-]|ghp_[A-Za-z0-9]' .mulch docs 2>/dev/null; then
            echo "::error::what looks like an access token is committed (see hits above)"
            exit 1
          fi
          echo "clean-room: .mulch and docs carry no machine-local paths or tokens"

  # The e2e runners are the operator's interface to the rig, and their failure
  # DIAGNOSIS is a feature: `set -e` aborting before a script's own `[ -n "$X" ]`
  # guard turns a readable error into a bare exit status. shellcheck does not
  # catch that (measured), so the invariant is policed here. The gate's own
  # regression suite runs alongside it — a gate nothing proves is a gate that
  # rots into a rubber stamp.
  # Renamed from shell-guards when the collection lint joined it: both police the
  # verification layer itself, which no other gate in this repo reads at all.
  verification-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Gate self-test (check-shell-guards.py)
        run: scripts/checks/test-shell-guards.sh

      - name: Guarded substitutions must survive to their own guard
        run: scripts/checks/check-shell-guards.py

      - name: Conformance gate self-test (check-collection-conformance.py)
        run: scripts/checks/test-collection-conformance.sh

      - name: e2e cells must be able to fail
        run: scripts/checks/check-collection-conformance.py

  # The demo console is not a Gradle module, so `./gradlew build` never sees it — its
  # vitest suite covers the seams that decide what a user is ALLOWED to see (the RFC 9470
  # challenge parser, `request()`'s error classification, and the elevation-window
  # arithmetic), so a regression there is an authorization-UX regression that would
  # otherwise merge green. Node-only: no rig, no browser, no Docker.
  demo-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example-demo-ui/package-lock.json

      - name: Install (lockfile-exact)
        run: npm ci
        working-directory: example-demo-ui

      - name: Typecheck (tsc -b --noEmit)
        run: npm run lint
        working-directory: example-demo-ui

      - name: Unit tests (vitest)
        run: npm test
        working-directory: example-demo-ui

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 25 ]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The example app's integration tests (CatalogCrudIT, ProductConcurrencyIT) run
      # against a real Postgres spun up by Testcontainers — never H2. GitHub-hosted
      # ubuntu runners ship Docker, so Testcontainers auto-detects it with no extra
      # config (the build leaves DOCKER_HOST unset on CI; see the example build.gradle.kts).
      # This step fails fast with a clear message if the daemon ever isn't reachable,
      # so a Testcontainers env problem can't masquerade as a code failure.
      - name: Verify Docker is available (for Testcontainers)
        run: docker info

      # `build` runs `check` -> `test`, which includes the Postgres-backed integration
      # tests above as well as the library unit tests, and compiles the example app
      # (incl. OpenAPI codegen). No daemon (ephemeral runner). Per-test pass/skip/fail
      # lines are surfaced by the shared testLogging config in the root build.gradle.kts.
      - name: Build and test (unit + Testcontainers integration)
        run: ./gradlew build --no-daemon

      # Always publish reports — on success too, so a green run is auditable, not just
      # failures. Includes the integration-test results.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 14
