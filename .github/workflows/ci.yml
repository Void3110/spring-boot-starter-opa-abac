name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21 ]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The example app's integration tests (CatalogCrudIT, ProductConcurrencyIT) run
      # against a real Postgres spun up by Testcontainers — never H2. GitHub-hosted
      # ubuntu runners ship Docker, so Testcontainers auto-detects it with no extra
      # config (the build leaves DOCKER_HOST unset on CI; see the example build.gradle.kts).
      # This step fails fast with a clear message if the daemon ever isn't reachable,
      # so a Testcontainers env problem can't masquerade as a code failure.
      - name: Verify Docker is available (for Testcontainers)
        run: docker info

      # `build` runs `check` -> `test`, which includes the Postgres-backed integration
      # tests above as well as the library unit tests, and compiles the example app
      # (incl. OpenAPI codegen). No daemon (ephemeral runner). Per-test pass/skip/fail
      # lines are surfaced by the shared testLogging config in the root build.gradle.kts.
      - name: Build and test (unit + Testcontainers integration)
        run: ./gradlew build --no-daemon

      # Always publish reports — on success too, so a green run is auditable, not just
      # failures. Includes the integration-test results.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 14
