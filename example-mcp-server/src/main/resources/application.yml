spring:
  application:
    name: example-mcp-server
  ai:
    mcp:
      server:
        name: opa-abac-catalog-tools
        version: 1.0.0
        # MUST be set EXPLICITLY, even though STREAMABLE is also the properties class's field default.
        # The 2.0.0 auto-configuration's @Conditionals match the PROPERTY STRING and ignore that field:
        # the streamable condition is havingValue="STREAMABLE" matchIfMissing=false, while the SSE twin
        # is havingValue="SSE" matchIfMissing=TRUE. So with this line absent the server silently serves
        # the LEGACY SSE transport (GET /sse + POST /mcp/message) and POST /mcp 404s — which is exactly
        # what this module did through T1-T4. The roster adapter's seam only exists on the streamable
        # transport, and RosterFilterInstaller fails startup naming this property if it is missing.
        protocol: STREAMABLE
        # The tool surface is declared with @McpTool annotations (see CatalogTools) and discovered by
        # Spring AI's annotation scanner.
        annotation-scanner:
          enabled: true

server:
  port: 8082

# Where the tools proxy to. On the rig this is the catalog service's IN-NETWORK address; the tools never
# reach it through a published host port.
example:
  mcp:
    catalog:
      base-url: http://localhost:8080
      connect-timeout: 2s
      read-timeout: 5s
    identity:
      # The claim carrying RFC 8693 `act` semantics. It MUST also appear in
      # opa.abac.subject.attribute-claims below — ActorClaimWiringCheck fails startup if it does not,
      # because a claim that never reaches the subject would make every agent call read as a human one.
      actor-claim: act_chain
      max-chain-depth: 4
      max-claim-length: 2048
    # The demo agent registry. Every dimension NARROWS — the tool-gate intersects these with the
    # principal's ceiling in Rego, so nothing here can grant an agent what its principal lacks.
    # allowed-tools is MANDATORY: an empty list denies every tool, it does not mean "unrestricted".
    agents:
      profiles:
        # Strictly narrower than its principal: structural reads only, capped below get_product's
        # medium risk tier. This is the persona the roster cut is demonstrated with.
        - actor-id: agent-readonly
          allowed-categories: [READ]
          allowed-tools: [list_catalogs, get_catalog]
          allowed-actions: [view, list]
          max-risk-tag: low
        # Deliberately WIDER than any demo principal — it lists WRITE and every verb. It exists to
        # prove on the live rig, not only in `opa test`, that a capability wider than the ceiling
        # yields the CEILING: this agent still cannot do anything its principal cannot.
        - actor-id: agent-overreach
          allowed-categories: [READ, WRITE, TAG, GRANT]
          allowed-tools: [list_catalogs, get_catalog, list_categories, get_product]
          allowed-actions: [view, list, create, update, delete]
          max-risk-tag: high
        # A known agent with zero capability — authoritative-empty, distinct from an outage.
        - actor-id: agent-revoked
          allowed-categories: []
          allowed-tools: []
          allowed-actions: []
          max-risk-tag: ""
    authz:
      # The OPA document the tool-gate asks — the PACKAGE path. The shipped client POSTs
      # /v1/data/<policy-path> for one decision and /v1/data/<policy-path>/bulk for a batch, so
      # 'agent_tools/allow' here would make the batch resolve a path that does not exist.
      policy-path: agent_tools
      agent-gate:
        # OFF removes the agent NARROWING only: the call is then evaluated as an ordinary human
        # principal's would be, and the catalog service still enforces that principal's ceiling on
        # every resource. There is deliberately no switch that disables call-time enforcement.
        # The roster reads the SAME switch, so with it off the advertised list is the ceiling-only cut
        # the call path would allow — a roster must never hide a tool the caller can successfully call.
        enabled: true
      roster-filter:
        # The tools/list filter. OFF skips the reflective adapter AND its startup smoke check — the
        # deliberate escape hatch for the day an SDK bump moves the pinned internals. At runtime OFF is
        # byte-identical to the outside-the-batch degradation path (the unfiltered list), with call-time
        # enforcement unchanged: OFF is never wider than ON.
        enabled: true
      role-source:
        # The user-management service — where the principal's type-level ceiling is resolved from.
        base-url: http://localhost:8081
        timeout: 2s

# The starter: this service reads the forwarded bearer into an AbacAuthentication. The OPA client is
# configured from T4, when the tool-gate starts asking policy questions.
opa:
  abac:
    enabled: true
    subject:
      # Explicit acknowledgment that a signature-validating gateway (APISIX openid-connect) fronts this
      # app — the starter's JWT extractor decodes the forwarded token WITHOUT verifying its signature,
      # so it stays disabled until this is set. Never enable gateway-less.
      trust-forwarded-jwt: true
      # Carries the delegation claim into AbacContext.Subject#attributes, where the extractor reads it.
      attribute-claims:
        - act_chain

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.dmitriikonovalov.example.mcp: INFO
