spring:
  application:
    name: catalog-management-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/catalog}
    username: ${SPRING_DATASOURCE_USERNAME:catalog}
    password: ${SPRING_DATASOURCE_PASSWORD:catalog}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

# ABAC / OPA — Phase 5.5-A enables N-level hierarchical authorization. The starter wires the ltree
# AncestorResolver + HierarchicalAuthorizer once this app supplies a LtreePathSource (HierarchyConfig).
# `inheritable` is the structural declaration mirrored into OPA data (infra/opa/data/*.json) that the
# rego inheritance clause reads; here it documents the same relations for the app's own reference.
opa:
  abac:
    hierarchy:
      enabled: ${OPA_ABAC_HIERARCHY_ENABLED:true}
      resolver: ${OPA_ABAC_HIERARCHY_RESOLVER:ltree}
      max-depth: ${OPA_ABAC_HIERARCHY_MAX_DEPTH:32}
      inheritable:
        category: [catalog]
        product: [category, catalog]

# Role-definition source for ABAC decisions:
#   demo (default) — the static DemoRoleDefinitionSupplier (Keycloak realm roles -> role definition)
#   http           — HttpRoleDefinitionSupplier, resolving the caller's effective role from the
#                    user-management service (the Phase-4 single-bean swap; fails closed on any error)
catalog:
  role-source: ${CATALOG_ROLE_SOURCE:demo}
  user-service:
    base-url: ${CATALOG_USER_SERVICE_BASE_URL:http://localhost:8080}
    timeout-ms: ${CATALOG_USER_SERVICE_TIMEOUT_MS:2000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Actuator: this is the demo app, so a broad set of endpoints is exposed over HTTP for local
# debugging. Note this is NOT a production-safe set — env/configprops/beans can leak config, and
# heapdump/threaddump are intentionally omitted here. Narrow this before any real deployment.
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans,mappings,loggers,metrics,liquibase,conditions
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  level:
    dev.dmitriikonovalov: INFO
