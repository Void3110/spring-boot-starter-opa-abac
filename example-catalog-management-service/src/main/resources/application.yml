spring:
  application:
    name: catalog-management-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/catalog}
    username: ${SPRING_DATASOURCE_USERNAME:catalog}
    password: ${SPRING_DATASOURCE_PASSWORD:catalog}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

# ABAC / OPA — Phase 5.5-A enables N-level hierarchical authorization. The starter wires the ltree
# AncestorResolver + HierarchicalAuthorizer once this app supplies a LtreePathSource (HierarchyConfig).
# `inheritable` is the structural declaration mirrored into OPA data (infra/opa/data/*.json) that the
# rego inheritance clause reads; here it documents the same relations for the app's own reference.
opa:
  abac:
    subject:
      # Explicit acknowledgment that a signature-validating gateway (APISIX openid-connect) fronts this
      # app — the starter's JWT extractor decodes the forwarded token WITHOUT verifying its signature,
      # so it stays disabled until this is set. Never enable gateway-less.
      trust-forwarded-jwt: true
      # Copied verbatim (type-preserved) into AbacContext.Subject#attributes, where the policy reads them:
      #   acr, auth_time — the step-up freshness control (ADR 0030 §5). auth_time MUST stay numeric;
      #                    the policy does arithmetic on it, and a string leaves `elevated` undefined
      #                    (fail-closed, but silently un-elevatable).
      #   act_chain      — the delegation claim an agent client's token carries. Its PRESENCE closes the
      #                    supervised path (ADR 0030 Amendment 4); the value is never interpreted here.
      attribute-claims:
        - acr
        - auth_time
        - act_chain
    hierarchy:
      enabled: ${OPA_ABAC_HIERARCHY_ENABLED:true}
      resolver: ${OPA_ABAC_HIERARCHY_RESOLVER:ltree}
      max-depth: ${OPA_ABAC_HIERARCHY_MAX_DEPTH:32}
      inheritable:
        category: [catalog]
        product: [category, catalog]

# Role-definition source for ABAC decisions:
#   demo (default) — the static DemoRoleDefinitionSupplier (Keycloak realm roles -> role definition)
#   http           — HttpRoleDefinitionSupplier, resolving the caller's effective role from the
#                    user-management service (the Phase-4 single-bean swap; fails closed on any error)
catalog:
  role-source: ${CATALOG_ROLE_SOURCE:demo}
  user-service:
    base-url: ${CATALOG_USER_SERVICE_BASE_URL:http://localhost:8080}
    timeout-ms: ${CATALOG_USER_SERVICE_TIMEOUT_MS:2000}
    # The supervised-scope edge (/internal/supervised-targets, ADR 0029) gets its OWN base-url so it can be
    # fault-injected alone — repointing this at a dead port degrades a supervisor to their own memberships
    # while the rest of the user-service edge (role resolve, tag definitions) keeps working. Defaults to the
    # shared base-url, so the shipped rig is unchanged.
    supervised-base-url: ${CATALOG_USER_SERVICE_SUPERVISED_BASE_URL:${catalog.user-service.base-url}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Actuator: this is the demo app, so a broad set of endpoints is exposed over HTTP for local
# debugging. Note this is NOT a production-safe set — env/configprops/beans can leak config, and
# heapdump/threaddump are intentionally omitted here. Narrow this before any real deployment.
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans,mappings,loggers,metrics,liquibase,conditions
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  level:
    dev.dmitriikonovalov: INFO
