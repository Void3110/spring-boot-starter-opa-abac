databaseChangeLog:
  - changeSet:
      id: 0001-create-catalog
      author: catalog-management-service
      changes:
        - createTable:
            tableName: catalog
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false

  - changeSet:
      id: 0001-create-category
      author: catalog-management-service
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: catalog_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: uuid
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(2000)
        - addForeignKeyConstraint:
            constraintName: fk_category_catalog
            baseTableName: category
            baseColumnNames: catalog_id
            referencedTableName: catalog
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_category_parent
            baseTableName: category
            baseColumnNames: parent_id
            referencedTableName: category
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_category_catalog
            tableName: category
            columns:
              - column:
                  name: catalog_id
        - createIndex:
            indexName: idx_category_parent
            tableName: category
            columns:
              - column:
                  name: parent_id

  - changeSet:
      id: 0001-create-product
      author: catalog-management-service
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: sku
                  type: varchar(64)
              - column:
                  name: price_cents
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_product_category
            baseTableName: product
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_product_category
            tableName: product
            columns:
              - column:
                  name: category_id
